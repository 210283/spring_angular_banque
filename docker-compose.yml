services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: votrebanque
      POSTGRES_USER: ${POSTGRES_USER:-votrebanque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-votrebanque}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-votrebanque}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER:-votrebanque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-votrebanque}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4200}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      APP_ADMIN_ENABLED: ${APP_ADMIN_ENABLED:-false}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_DEMO_ENDPOINTS_ENABLED: ${APP_DEMO_ENDPOINTS_ENABLED:-false}
      APP_DEMO_SESSION_ENABLED: ${APP_DEMO_SESSION_ENABLED:-false}
      APP_DEMO_SESSION_DURATION_MINUTES: ${APP_DEMO_SESSION_DURATION_MINUTES:-120}
      APP_DEMO_SESSION_CLEANUP_INTERVAL_MS: ${APP_DEMO_SESSION_CLEANUP_INTERVAL_MS:-900000}
      APP_DEMO_SESSION_MIN_INTERVAL_SECONDS: ${APP_DEMO_SESSION_MIN_INTERVAL_SECONDS:-120}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
