<style>
  :host {
    font-family: 'Inter', sans-serif;
    background-color: #f8f9fa;
    display: block;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(90deg, #6332d8 0%, #3b82f6 100%);
    color: white;
    padding: 1.5rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }
  h1 { margin: 0; font-size: 1.8rem; }
  main { padding: 2rem; }
  .demo-banner {
    background: #fef3c7;
    color: #78350f;
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.9rem;
  }
  .demo-banner button {
    background: #78350f;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 0.35rem 0.75rem;
    cursor: pointer;
  }
</style>

<header>
  <h1>🏛️ {{ title() }}</h1>
</header>

@if (authService.isDemoSession()) {
  <div class="demo-banner">
    <span>Mode démo : explorez librement, les données sont réinitialisées automatiquement.</span>
    <button type="button" (click)="switchToDemoAdmin()">Vue admin : ouvrir un compte</button>
    <button type="button" (click)="switchToDemoClient()">Revenir au compte démo</button>
  </div>
}

<main>
  <router-outlet></router-outlet>
</main>
