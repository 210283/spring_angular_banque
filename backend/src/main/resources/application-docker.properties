spring.datasource.url=jdbc:postgresql://postgres:5432/votrebanque
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:votrebanque}
spring.datasource.password=${POSTGRES_PASSWORD:votrebanque}

app.mailpit.api-url=http://mailpit:8025
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.admin.enabled=false
app.demo.endpoints.enabled=false
app.demo.session.enabled=${APP_DEMO_SESSION_ENABLED:false}
app.demo.session.duration-minutes=${APP_DEMO_SESSION_DURATION_MINUTES:120}
app.demo.session.cleanup-interval-ms=${APP_DEMO_SESSION_CLEANUP_INTERVAL_MS:900000}
app.demo.session.min-interval-seconds=${APP_DEMO_SESSION_MIN_INTERVAL_SECONDS:120}
